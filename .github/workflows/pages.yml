name: pages

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .[dev]
      - name: Build static demo package
        run: python scripts/package_static_demo.py
      - name: Verify fixture package is explicitly not live-ready
        run: |
          python - <<'PY'
          import json
          data = json.load(open("public/deployment-manifest.json", encoding="utf-8"))
          assert data["ready_for_public_live_demo"] is False
          assert data["mode"] == "static-evidence-demo"
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
